name: btc-classification

services:
  postgres:
    container_name: btc-classification-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brainseg}
      POSTGRES_USER: ${POSTGRES_USER:-brainseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainseg}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainseg} -d ${POSTGRES_DB:-brainseg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: btc-classification-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    container_name: btc-classification-mlflow
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-brainseg}
      POSTGRES_USER: ${POSTGRES_USER:-brainseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainseg}
    ports:
      - "${MLFLOW_PORT:-55000}:5000"
    volumes:
      - mlflow-data:/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  celery-worker:
    container_name: btc-classification-celery-worker
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    command: celery -A worker.celery_app:celery_app worker --loglevel=INFO --pool=solo
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-brainseg}
      POSTGRES_USER: ${POSTGRES_USER:-brainseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainseg}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-brainseg}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - mlflow-data:/mlruns:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  api:
    container_name: btc-classification-api
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-brainseg}
      POSTGRES_USER: ${POSTGRES_USER:-brainseg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainseg}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-brainseg}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
    ports:
      - "${API_PORT:-59000}:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  mlflow-data:
