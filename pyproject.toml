[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-classification"
version = "0.1.0"
description = "Automated brain tumor MRI classification pipeline"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mlflow>=2.15",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.0",
    "torchvision>=0.15",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "^(data|artifacts|mlruns)/"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
