name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check app scripts worker tests
      - name: Ruff format check
        run: python -m ruff format --check app scripts worker tests
      - name: Mypy
        continue-on-error: true
        run: python -m mypy app worker scripts
      - name: Compile Python sources
        run: python -m compileall -q app migrations scripts worker tests
      - name: Unit and integration tests
        run: python -m pytest --cov=app --cov=worker --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  migration-check:
    name: Migration and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install migration dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Generate offline migration SQL
        run: python -m alembic upgrade head --sql > migration.sql
      - name: Check migration SQL artifact
        run: test -s migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: migration-sql
          path: migration.sql

  security:
    name: Secret and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit --strict

  docker-build:
    name: Build runtime images
    runs-on: ubuntu-latest
    needs: [python-quality, migration-check, security]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build API and MLflow images
        run: docker compose build api celery-worker mlflow
